[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-backtester"
version = "0.3.0"
description = "A-share minute-bar backtesting research and audit layer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=15,<22",
    "duckdb>=1.1,<2",
    "plotly>=5.18,<7",
    "streamlit>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "coverage>=7.10,<8",
    "build>=1.3,<2",
]
ml = [
    "torch>=2.2",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "PyYAML>=6",
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["python*", "storage*", "dashboard*"]
exclude = ["python.tests*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
storage = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["python", "storage"]
omit = ["python/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
