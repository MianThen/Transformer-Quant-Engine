name: ci

on:
  push:
  pull_request:

jobs:
  cpp-core-and-ml-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpp_engine
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DQBT_BUILD_PYTHON=OFF
          -DQBT_BUILD_LIVE_ENGINE=OFF
          -DQBT_ENABLE_ML=ON
          -DQBT_ML_BACKEND=mock
          -DQBT_BUILD_ML_TESTS=ON
          -DQBT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  python-ml-business:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_model/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test ML business layer
        run: python -m pytest python/tests/test_qbt_ml.py -q
      - name: Compile
        run: python -m compileall -q python storage dashboard

